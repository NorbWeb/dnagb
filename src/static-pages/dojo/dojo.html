<!-- map -->
<div id="map"></div>

<!-- dialog -->
<dialog id="dojo-dialog" closedby="any">
  <a class="link" href="#" target="_blank" title="Link zum Dojo">
    <img class="logo" src="" alt="Link zum Dojo" />
    <svg class="icon placeholder" width="24" height="24">
      <use href="/assets/icons/sprite.svg#home"></use>
    </svg>
    <div class="name"></div>
    <svg class="icon external" width="24" height="24">
      <use href="/assets/icons/sprite.svg#external-link"></use>
    </svg>
  </a>
  <div class="city"></div>
  <div class="body">
    <div class="description"></div>
  </div>
  <button commandfor="dojo-dialog" command="close" class="close-btn" autofocus>
    <svg class="icon" width="24" height="24">
      <use href="/assets/icons/sprite.svg#close"></use>
    </svg>
  </button>
</dialog>
