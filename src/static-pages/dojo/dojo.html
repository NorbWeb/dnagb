<div id="map"></div>

<dialog id="dojo-dialog">
  <div class="header">
    <span class="name"></span>
    <button
      commandfor="dojo-dialog"
      command="close"
      class="close-btn"
      autofocus
    >
      <svg class="icon" width="24" height="24" style="display: inline-block">
        <use href="/assets/icons/sprite.svg#close"></use>
      </svg>
    </button>
  </div>
  <div class="dojo-info-wrapper">
    <div class="city"></div>
    <a class="link" href="#" target="_blank" title="Link zum Dojo">
      <img class="logo" src="" alt="Link zum Dojo" />
    </a>
  </div>
  <div class="dojo-logo-wrapper"></div>
  <div class="description"></div>
</dialog>
